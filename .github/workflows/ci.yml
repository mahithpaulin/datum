name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Compile and verify example
        run: |
          python -m datum.cli build --config examples/datum.toml --json > build-result.json
          python -m datum.cli verify examples/output/example/current --json > verify-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          build = json.loads(Path("build-result.json").read_text(encoding="utf-8"))
          verify = json.loads(Path("verify-result.json").read_text(encoding="utf-8"))
          assert build["status"] == "passed", build
          assert build["records"]["exported"] == 3, build["records"]
          assert verify["ok"] is True, verify
          print("example build and verification passed")
          PY
      - name: Verify checked-in expected snapshot
        run: python -m datum.cli verify examples/expected

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/datum-venv
          /tmp/datum-venv/bin/python -m pip install --upgrade pip
          /tmp/datum-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/datum-venv/bin/datum version
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: datum-dist
          path: dist/
          if-no-files-found: error
