name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "datum/**"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Synthetic smoke benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run smoke benchmark
        run: |
          python -m datum.cli benchmark \
            --files 8 \
            --file-kib 16 \
            --workers 2 \
            --json-out benchmarks/results/ci-smoke.json
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmarks/results/ci-smoke.json
          if-no-files-found: error

  compare:
    name: Cross-tool comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pandas>=2.2" "duckdb>=1.0"
      - name: Run comparison
        run: |
          python benchmarks/compare.py \
            --rows 30000 \
            --text-files 48 \
            --text-kib 16 \
            --workers 2 \
            --repetitions 3 \
            --json-out benchmarks/results/comparison.json
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: benchmarks/results/comparison.json
          if-no-files-found: error
